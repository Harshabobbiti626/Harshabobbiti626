<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" fill="none">
  <style>
    @keyframes floatA { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
    @keyframes floatB { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    @keyframes floatC { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-18px); } }
    @keyframes drift  { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: .55; } 80% { opacity: .35; } 100% { transform: translate(24px,-46px); opacity: 0; } }
    @keyframes pulse  { 0%,100% { opacity: .22; } 50% { opacity: .45; } }
    .cubeA { animation: floatA 6s   ease-in-out infinite; }
    .cubeB { animation: floatB 7.5s ease-in-out infinite; animation-delay: -2.5s; }
    .cubeC { animation: floatC 5.2s ease-in-out infinite; animation-delay: -1.2s; }
    .spark { animation: drift 7s linear infinite; }
    .glowA { animation: pulse 6s ease-in-out infinite; }
    .glowB { animation: pulse 7.5s ease-in-out infinite; animation-delay: -2.5s; }
  </style>

  <defs>
    <linearGradient id="topV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDC6FF"/><stop offset="1" stop-color="#8A7CFF"/>
    </linearGradient>
    <linearGradient id="topB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B3D4FF"/><stop offset="1" stop-color="#5EA2FF"/>
    </linearGradient>
    <linearGradient id="topT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5F2EE"/><stop offset="1" stop-color="#3DDAD7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A7CFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8A7CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- constellation links -->
  <path d="M345 205 L462 100 L580 160" stroke="#8A7CFF" stroke-opacity="0.28"
        stroke-width="1.5" stroke-dasharray="2 7" stroke-linecap="round" fill="none"/>

  <!-- ground glows -->
  <ellipse class="glowA" cx="580" cy="272" rx="125" ry="17" fill="url(#glow)"/>
  <ellipse class="glowB" cx="345" cy="288" rx="95" ry="14" fill="url(#glow)"/>

  <!-- drift sparks -->
  <circle class="spark" cx="252" cy="128" r="2.5" fill="#8A7CFF"/>
  <circle class="spark" cx="706" cy="112" r="2"   fill="#5EA2FF" style="animation-delay:-2.4s"/>
  <circle class="spark" cx="665" cy="248" r="3"   fill="#3DDAD7" style="animation-delay:-4.1s"/>
  <circle class="spark" cx="302" cy="66"  r="2"   fill="#5EA2FF" style="animation-delay:-5.3s"/>

  <!-- cube A · API layer (violet) -->
  <g class="cubeA">
    <polygon points="580,118 654,155 580,192 506,155" fill="url(#topV)"/>
    <polygon points="506,155 580,192 580,258 506,221" fill="#6E60E8"/>
    <polygon points="654,155 580,192 580,258 654,221" fill="#4B3FBE"/>
  </g>

  <!-- cube B · data layer (blue) -->
  <g class="cubeB">
    <polygon points="345,173 399,200 345,227 291,200" fill="url(#topB)"/>
    <polygon points="291,200 345,227 345,277 291,250" fill="#4E8CE8"/>
    <polygon points="399,200 345,227 345,277 399,250" fill="#3563B8"/>
  </g>

  <!-- cube C · cloud layer (teal) -->
  <g class="cubeC">
    <polygon points="462,74 498,92 462,110 426,92" fill="url(#topT)"/>
    <polygon points="426,92 462,110 462,144 426,126" fill="#33B4B1"/>
    <polygon points="498,92 462,110 462,144 498,126" fill="#23807E"/>
  </g>
</svg>
