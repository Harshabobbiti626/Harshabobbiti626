<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="380" viewBox="0 0 900 380" fill="none">
  <style>
    @keyframes bob    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    @keyframes twinkle{ 0%,100% { opacity: .12; } 50% { opacity: .8; } }
    @keyframes shoot  { 0%,86% { transform: translate(0,0); opacity: 0; } 88% { opacity: 1; } 100% { transform: translate(-170px,64px); opacity: 0; } }
    @keyframes puff   { 0%,100% { opacity: .1; } 50% { opacity: .6; } }
    .astro { animation: bob 6s ease-in-out infinite; }
    .star  { animation: twinkle 3.2s ease-in-out infinite; }
    .trail { animation: shoot 9s linear infinite; }
    .jet1  { animation: puff .9s ease-in-out infinite; }
    .jet2  { animation: puff .9s ease-in-out infinite; animation-delay: -.45s; }
  </style>

  <defs>
    <radialGradient id="planetG" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#D4CEFF"/><stop offset="0.6" stop-color="#8A7CFF"/><stop offset="1" stop-color="#5A4BD0"/>
    </radialGradient>
    <linearGradient id="trailG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF3" stop-opacity="0"/><stop offset="1" stop-color="#E6EDF3" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- starfield -->
  <circle class="star" cx="110" cy="70"  r="2.5" fill="#8A7CFF"/>
  <circle class="star" cx="330" cy="45"  r="2"   fill="#5EA2FF" style="animation-delay:-1.1s"/>
  <circle class="star" cx="520" cy="90"  r="2.5" fill="#3DDAD7" style="animation-delay:-2.2s"/>
  <circle class="star" cx="770" cy="120" r="2"   fill="#8A7CFF" style="animation-delay:-.6s"/>
  <circle class="star" cx="840" cy="250" r="2.5" fill="#5EA2FF" style="animation-delay:-2.8s"/>
  <circle class="star" cx="480" cy="300" r="2"   fill="#3DDAD7" style="animation-delay:-1.7s"/>
  <circle class="star" cx="80"  cy="300" r="2"   fill="#8A7CFF" style="animation-delay:-.3s"/>
  <circle class="star" cx="640" cy="60"  r="1.6" fill="#E6EDF3" style="animation-delay:-2.4s"/>
  <path class="star" d="M700,200 l1.8,4.2 4.2,1.8 -4.2,1.8 -1.8,4.2 -1.8,-4.2 -4.2,-1.8 4.2,-1.8 Z" fill="#8A7CFF"/>
  <path class="star" d="M240,60 l1.8,4.2 4.2,1.8 -4.2,1.8 -1.8,4.2 -1.8,-4.2 -4.2,-1.8 4.2,-1.8 Z" fill="#3DDAD7" style="animation-delay:-1.5s"/>
  <path class="star" d="M420,180 l1.4,3.4 3.4,1.4 -3.4,1.4 -1.4,3.4 -1.4,-3.4 -3.4,-1.4 3.4,-1.4 Z" fill="#5EA2FF" style="animation-delay:-2.1s"/>

  <!-- shooting star -->
  <g class="trail">
    <line x1="762" y1="42" x2="832" y2="18" stroke="url(#trailG)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="832" cy="18" r="3" fill="#E6EDF3"/>
  </g>

  <!-- orbit path + planet -->
  <path id="orb" d="M 40,252 a 195,58 0 1,0 390,0 a 195,58 0 1,0 -390,0" stroke="#5EA2FF" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 8" fill="none"/>
  <circle cx="225" cy="252" r="104" fill="url(#planetG)"/>
  <circle cx="190" cy="215" r="13" fill="#6E60E8" opacity="0.85"/>
  <circle cx="262" cy="286" r="9"  fill="#6E60E8" opacity="0.85"/>
  <circle cx="176" cy="282" r="6"  fill="#6E60E8" opacity="0.85"/>

  <!-- orbiting mini cube -->
  <g>
    <polygon points="0,-8 14,0 0,8 -14,0" fill="#7FE7E4"/>
    <polygon points="-14,0 0,8 0,22 -14,14" fill="#33B4B1"/>
    <polygon points="14,0 0,8 0,22 14,14" fill="#23807E"/>
    <animateMotion dur="14s" repeatCount="indefinite">
      <mpath xlink:href="#orb" href="#orb"/>
    </animateMotion>
  </g>

  <!-- tether -->
  <path d="M 592,196 C 500,250 410,240 332,210" stroke="#8A7CFF" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 6" fill="none"/>

  <!-- astronaut -->
  <g transform="translate(620,160)">
    <g class="astro">
      <rect x="-30" y="-16" width="15" height="36" rx="6" fill="#8A7CFF"/>
      <circle class="jet1" cx="-24" cy="26" r="3" fill="#5EA2FF"/>
      <circle class="jet2" cx="-19" cy="30" r="2" fill="#3DDAD7"/>
      <rect x="-17" y="-16" width="36" height="40" rx="13" fill="#E6EDF3"/>
      <rect x="-5" y="-4" width="13" height="10" rx="2.5" fill="#3DDAD7"/>
      <rect x="-32" y="-6" width="12" height="24" rx="6" fill="#E6EDF3" transform="rotate(22 -26 -6)"/>
      <rect x="17" y="-30" width="12" height="26" rx="6" fill="#E6EDF3">
        <animateTransform attributeName="transform" type="rotate" values="30 23 -24; 62 23 -24; 30 23 -24" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-14" y="22" width="11" height="19" rx="5" fill="#E6EDF3" transform="rotate(8 -8 22)"/>
      <rect x="4" y="22" width="11" height="19" rx="5" fill="#E6EDF3" transform="rotate(-8 10 22)"/>
      <circle cx="1" cy="-34" r="20" fill="#E6EDF3"/>
      <rect x="-12" y="-44" width="26" height="18" rx="9" fill="#1A2030"/>
      <circle cx="6" cy="-38" r="3.2" fill="#E6EDF3" opacity="0.9"/>
      <circle cx="-1" cy="-34" r="1.3" fill="#E6EDF3" opacity="0.6"/>
    </g>
  </g>
</svg>
